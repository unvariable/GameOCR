[project]
name = "gameocr"
version = "0.2.2"
description = "Oyun altyazılarını OCR ile okuyup DeepL ile çeviren ve şeffaf overlay olarak gösteren araç"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rapidocr-onnxruntime>=1.3",
    "paddlepaddle-gpu==3.3.1",
    "paddleocr>=3.3",
    "numpy",
    "opencv-python-headless>=4.10",
    "mss>=9.0",
    "python-xlib>=0.33",
    "dbus-fast>=2.24",
    "rapidfuzz>=3.9",
    "PyQt6>=6.7",
    "deepl>=1.18",
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
    "pyinstaller>=6.0",
    "tomli-w>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = [
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
]
windows = [
    "dxcam>=0.0.5; sys_platform == 'win32'",
]
build = [
    "pyinstaller>=6.0",
    "nuitka>=2.0",
]

[project.scripts]
gameocr = "gameocr.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Paddle'ın GPU wheel'leri PyPI'da değil, kendi indeksinde (CUDA 12.6 derlemesi).
# Wheel CUDA/cuDNN kütüphanelerini nvidia-* paketleriyle getirir; sistemde
# yalnızca NVIDIA sürücüsü gerekir.
index-strategy = "unsafe-best-match"
# Güvenlik alt sınırları (Dependabot / CVE-502 vb. düzeltmeleri korur)
constraint-dependencies = [
    "stanza>=1.12.2",
]

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gameocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
